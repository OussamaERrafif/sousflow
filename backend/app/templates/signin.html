<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoussFlow — تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            font-family: 'Tajawal', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .form-control::placeholder {
            color: var(--text-secondary);
        }
        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .btn-login {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
            color: white;
        }
        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
        }
        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.9rem;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #60a5fa 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .brand-icon i {
            font-size: 1.8rem;
            color: white;
        }
        .language-switch {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
        .language-switch a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .language-switch a:hover {
            color: var(--accent-blue);
        }
        .divider {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <div class="language-switch">
        <a href="/ar/signin"><i class="bi bi-globe"></i> العربية</a>
    </div>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-droplet-half"></i>
            </div>
            <h3 class="fw-bold mb-1">SoussFlow</h3>
            <p class="text-secondary small mb-0">الزراعة الذكية لل olives</p>
        </div>

        <div id="error-msg" class="alert-error mb-3 d-none"></div>
        <div id="success-msg" class="alert mb-3 d-none" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--accent-green); border-radius: 12px; padding: 1rem;"></div>

        <form id="signinForm">
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <div class="position-relative">
                    <input type="text" class="form-control" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                    <i class="bi bi-person position-absolute" style="top: 14px; right: 14px; color: var(--text-secondary);"></i>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">كلمة المرور</label>
                <div class="position-relative">
                    <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                    <i class="bi bi-lock position-absolute" style="top: 14px; right: 14px; color: var(--text-secondary);"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="bi bi-box-arrow-in-left me-2"></i> تسجيل الدخول
            </button>
        </form>

        <div class="divider">
            <span>نظام الزراعة الذكية</span>
        </div>

        <div class="text-center">
            <small class="text-secondary">
                <i class="bi bi-tree me-1"></i> نظام إدارة الري الذكي
            </small>
        </div>
    </div>

    <script>
        const returnUrl = new URLSearchParams(window.location.search).get('return') || '/';

        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> جاري التحقق...';

            try {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                console.log('Signing in with:', username);
                
                const res = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                console.log('Response status:', res.status);
                const data = await res.json();
                console.log('Response data:', data);

                if (!res.ok) {
                    throw new Error(data.detail || 'بيانات الدخول غير صحيحة');
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));

                successDiv.textContent = 'تم تسجيل الدخول بنجاح!';
                successDiv.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = returnUrl;
                }, 500);

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-left me-2"></i> تسجيل الدخول';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = returnUrl || '/';
        }
    </script>
</body>
</html>
